<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leni Studio</title>
  <meta name="description" content="Handmade shirts and shorts, coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Playfair+Display:wght@400;500&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lora', serif;
      background: #F5F4EF;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      overflow-x: hidden;
    }

    .wrap {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    /* Logo */
    .logo {
      margin-bottom: 56px;
    }
    .logo svg {
      height: 36px;
      width: auto;
    }

    /* Form */
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: #5C4736;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      border: none;
      border-bottom: 1px solid #D1C7BB;
      border-radius: 0;
      padding: 12px 0;
      font-family: 'Lora', serif;
      font-size: 16px;
      color: #EF233C;
      background: transparent;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    input::placeholder { color: #EF233C; opacity: 0.55; }
    input:focus { border-bottom-color: #5C4736; }

    button {
      width: 100%;
      background: #5C4736;
      color: #F5F4EF;
      border: none;
      padding: 14px 16px;
      font-family: 'Lora', serif;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }
    button:hover { background: #4a3829; }
    button:disabled { background: #C2B8AD; cursor: default; }

    .success {
      display: none;
      font-family: 'Lora', serif;
      font-size: 0.875rem;
      color: #5C4736;
      letter-spacing: 0.04em;
      margin-top: 20px;
      line-height: 1.7;
    }

    .error {
      display: none;
      font-size: 0.75rem;
      color: #c00;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="logo">
      <img src="images/leni-logo.svg" alt="Leni Studio" style="height:48px; width:auto;">
    </div>

    <h1>Join our mailing list and never miss a new drop</h1>

    <form id="signup-form">
      <div class="field">
        <input type="text" id="first-name" name="first_name" placeholder="First name" required autocomplete="given-name">
      </div>
      <div class="field">
        <input type="text" id="last-name" name="last_name" placeholder="Last name" required autocomplete="family-name">
      </div>
      <div class="field">
        <input type="email" id="email" name="email" placeholder="Email address" required autocomplete="email">
      </div>
      <button type="submit" id="submit-btn">Sign Up</button>
      <p class="error" id="error-msg">Something went wrong. Please try again.</p>
    </form>

    <p class="success" id="success-msg">
      Thank you. We'll be in touch soon.
    </p>

  </div>

  <script>
    document.getElementById('signup-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const form = document.getElementById('signup-form');
      const success = document.getElementById('success-msg');
      const error = document.getElementById('error-msg');

      btn.textContent = 'Submitting…';
      btn.disabled = true;
      error.style.display = 'none';

      // Collect data
      const data = {
        first_name: document.getElementById('first-name').value.trim(),
        last_name:  document.getElementById('last-name').value.trim(),
        email:      document.getElementById('email').value.trim(),
      };

      // Submit to Netlify Forms
      fetch('/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ 'form-name': 'waitlist', ...data }).toString(),
      })
      .then(() => {
        form.style.display = 'none';
        success.style.display = 'block';
      })
      .catch(() => {
        btn.textContent = 'Notify Me';
        btn.disabled = false;
        error.style.display = 'block';
      });
    });
  </script>

  <!-- Hidden form for Netlify Forms detection -->
  <form name="waitlist" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="first_name">
    <input type="text" name="last_name">
    <input type="email" name="email">
  </form>

</body>
</html>
